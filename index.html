<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전북대 관심 공지 모음</title>
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --accent: #0b3d91;      /* 전북대 상징색 계열 남색 */
    --accent-2: #1e6fd9;
    --border: #e4e7ec;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.06);
    --badge-campus: #0b3d91;
    --badge-student: #0f8a5f;
  }
  :root[data-theme="dark"] {
    --bg: #0f1216;
    --card: #1a1e24;
    --text: #f1f2f4;
    --muted: #9aa2af;
    --accent: #6ea8fe;
    --accent-2: #6ea8fe;
    --border: #2a2f37;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    --badge-campus: #3b6fd6;
    --badge-student: #24a374;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216;
      --card: #1a1e24;
      --text: #f1f2f4;
      --muted: #9aa2af;
      --accent: #6ea8fe;
      --accent-2: #6ea8fe;
      --border: #2a2f37;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      --badge-campus: #3b6fd6;
      --badge-student: #24a374;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
    padding: 36px 16px 28px;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 6px;
    color: #ffffff;
    letter-spacing: -0.3px;
  }
  .sub { color: rgba(255, 255, 255, 0.85); font-size: 14px; margin: 0; }
  .controls {
    max-width: 760px;
    margin: -18px auto 0;
    padding: 0 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    position: relative;
    z-index: 1;
  }
  .chip {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip:hover { border-color: var(--accent-2); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  main {
    max-width: 760px;
    margin: 20px auto 40px;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  a.item {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  a.item:hover {
    border-color: var(--accent-2);
    transform: translateY(-1px);
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--badge-campus);
    color: #fff;
    margin-right: 8px;
    vertical-align: middle;
  }
  .badge.student { background: var(--badge-student); }
  .title { font-size: 15px; font-weight: 600; line-height: 1.45; }
  .date { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="hero">
  <header>
    <h1>전북대 관심 공지 모음</h1>
    <p class="sub">모집 · 프로젝트 · 장학금 · 선발 · AI · 빅데이터 · 산업 키워드가 포함된 최근 공지</p>
  </header>
</div>
<div class="controls" id="filters"></div>
<main id="list"></main>

<script>
const KEYWORDS = ["모집","프로젝트","장학금","선발","AI","빅데이터","산업"];
let activeKeyword = null;
let allNotices = [];

async function load() {
  const res = await fetch("data/notices.json", { cache: "no-store" });
  allNotices = await res.json();
  renderFilters();
  render();
}

function renderFilters() {
  const el = document.getElementById("filters");
  el.innerHTML = "";
  const allChip = makeChip("전체", null);
  el.appendChild(allChip);
  KEYWORDS.forEach(k => el.appendChild(makeChip(k, k)));
}

function makeChip(label, keyword) {
  const btn = document.createElement("button");
  btn.className = "chip" + (activeKeyword === keyword ? " active" : "");
  btn.textContent = label;
  btn.onclick = () => {
    activeKeyword = keyword;
    renderFilters();
    render();
  };
  return btn;
}

function render() {
  const list = document.getElementById("list");
  const items = activeKeyword
    ? allNotices.filter(n => n.title.includes(activeKeyword))
    : allNotices;

  if (items.length === 0) {
    list.innerHTML = '<p class="empty">표시할 공지가 없습니다.</p>';
    return;
  }

  list.innerHTML = items.map(n => `
    <a class="item" href="${n.link}" target="_blank" rel="noopener">
      <span class="badge${n.board === "학생공지" ? " student" : ""}">${n.board}</span>
      <span class="title">${escapeHtml(n.title)}</span>
      <div class="date">${n.date}</div>
    </a>
  `).join("");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

load();
</script>
</body>
</html>
